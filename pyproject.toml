[project]
name = "iar-code"
version = "0.1.0"
description = "Reproduction package for Uncovering the Turing Test's Latent Signal: Indistinguishability as a Reward."
requires-python = ">=3.11"
dependencies = [
  "accelerate>=0.33",
  "datasets>=2.20",
  "httpx>=0.27",
  "langdetect==1.0.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "sqlparse==0.6.0",
  "tenacity>=8.5",
  "torch>=2.3",
  "tqdm>=4.66",
  "transformers>=4.44",
]

[project.optional-dependencies]
grpo = [
  "accelerate==1.13.0",
  "matplotlib>=3.8",
  "optuna>=4.0,<5",
  "peft==0.19.1",
  "transformers==4.57.6",
  "trl==0.27.2",
]
figures = ["matplotlib>=3.8", "cairosvg==2.9.0", "svgelements==1.9.6"]
analysis = ["scikit-learn>=1.5"]
test = ["pytest>=8,<10"]

[project.scripts]
iar-grpo-train = "iar_grpo.train:main"
iar-reproduce = "iar_repro.__main__:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
