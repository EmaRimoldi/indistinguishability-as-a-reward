project:
  name: indistinguishability-as-a-reward
  root: /home/erimoldi/projects/indistinguishability-as-a-reward
  seed: 17

paths:
  data_cache: data/cache
  hf_cache: models/cache/huggingface
  experiments: experiments/mbpp_qwen25_3b_v1/trial100
  checkpoints: models/checkpoints/mbpp_qwen25_3b_v1/trial100
  openrouter_env: models/openrouter/.env

dataset:
  phase0_config: configs/qwen25_3b_phase0_actor.yaml
  name: google-research-datasets/mbpp
  split: test
  selection: manifest
  index_manifest: configs/hpo_train100_seed17.json

trial:
  run_name: qwen25_3b_grpo_trial100
  prompt_count: 100
  expected_reward_calls: 400

actor:
  role: A
  model_id: Qwen/Qwen2.5-3B-Instruct
  local_files_only: true
  lora:
    r: 32
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

discriminator:
  role: B
  provider: openrouter
  model_id: deepseek/deepseek-v4-flash
  target_model_name: DeepSeek V4 Flash
  judge_max_tokens: 1
  temperature: 0
  top_logprobs: 5
  strict_logprobs: true
  request_overrides:
    reasoning:
      enabled: false
  provider_routing:
    require_parameters: true
    allow_fallbacks: false

reward:
  type: pointwise_self_attribution_logprob
  value: log_p_own
  max_reward_calls: 400
  max_http_requests: 1200
  max_attempts_per_call: 3
  max_concurrency: 2
  timeout_seconds: 120

training:
  algorithm: GRPO
  world_size: 1
  num_generations: 4
  generation_batch_size: 40
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  max_steps: 100
  max_prompt_tokens: 4096
  max_completion_length: 768
  temperature: 0.6
  top_p: 1.0
  learning_rate: 3.0e-5
  warmup_ratio: 0.0
  lr_scheduler_type: constant
  gradient_checkpointing: true
  mask_truncated_completions: true
  beta: 3.0e-3
  loss_type: dr_grpo
  scale_rewards: group
  num_completions_to_print: 0
  save_strategy: steps
  save_steps: 50
  save_total_limit: 2
  save_only_model: true

evaluation:
  checkpoints: [0, 50, 100]
  batch_size: 8
  unit_test_timeout_seconds: 5
  validation:
    split: validation
    count: 90
    num_generations: 1
    temperature: 0
    top_p: 1.0
  max_reward_attempts: 3
  max_concurrency: 2
  timeout_seconds: 120
  paired_lcb_z: 1.6448536269514722
  max_pass_at_1_drop: 0.02

hpo:
  study_name: grpo_log_p_own_v1
  trial_number: 17
  source: HPO_FINAL_RECOMMENDATION.md
  parameters:
    learning_rate: 3.0e-5
    beta: 3.0e-3
    temperature: 0.6
    top_p: 1.0
    lora_r: 32
    lora_alpha: 32
    lora_dropout: 0.05
    scale_rewards: group
