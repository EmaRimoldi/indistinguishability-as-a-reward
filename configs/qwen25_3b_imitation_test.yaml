project:
  name: indistinguishability-as-a-reward
  root: /home/erimoldi/projects/indistinguishability-as-a-reward
  seed: 17

paths:
  data_cache: data/cache
  hf_cache: models/cache/huggingface
  experiments: experiments/mbpp_qwen25_3b_v1/phase0
  openrouter_env: models/openrouter/.env
  model_manifest: models/manifests/models.yaml

dataset:
  name: google-research-datasets/mbpp
  config_name: null
  prompt_style: mbpp_google_original
  fewshot_split: prompt
  fewshot_count: 10
  smoke_split: validation
  smoke_count: 10
  full_splits: [test]

generator:
  role: A0
  # Use the immutable local snapshot path.  The shared HF cache's symbolic
  # revision lookup intermittently fails inside Slurm jobs, despite the files
  # being present; this loads the exact downloaded Qwen2.5-3B-Instruct weights.
  model_id: /home/erimoldi/projects/indistinguishability-as-a-reward/models/cache/huggingface/models--Qwen--Qwen2.5-3B-Instruct/snapshots/aa8e72537993ba99e69dfaafa59ed015b17504d1
  source_model_id: Qwen/Qwen2.5-3B-Instruct
  local_files_only: true
  dtype: auto
  device_map: auto
  max_new_tokens: 512
  temperature: 0.2
  top_p: 0.95
  variants: [imitation]

discriminator:
  role: B
  provider: openrouter
  model_id: deepseek/deepseek-v4-flash
  collect_own_answer: false
  own_answer_max_tokens: 512
  judge_max_tokens: 1
  temperature: 0
  logprobs: true
  top_logprobs: 5
  strict_logprobs: true
  request_overrides:
    reasoning:
      enabled: false
  provider_routing:
    require_parameters: true
    allow_fallbacks: false

unit_tests:
  enabled: true
  timeout_seconds: 5

run_modes:
  qwen25_3b_imitation_test:
    splits:
      test: null
