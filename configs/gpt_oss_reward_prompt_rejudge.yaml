project:
  name: indistinguishability-as-a-reward
  root: /home/erimoldi/projects/indistinguishability-as-a-reward
  seed: 23

paths:
  data_cache: data/cache
  hf_cache: models/cache/huggingface
  experiments: experiments
  openrouter_env: models/openrouter/.env
  model_manifest: models/manifests/models.yaml

dataset:
  name: google-research-datasets/mbpp
  config_name: null
  prompt_style: mbpp_google_original
  fewshot_split: prompt
  fewshot_count: 10

discriminator:
  role: B
  provider: openrouter
  model_id: openai/gpt-oss-120b
  own_answer_max_tokens: 4096
  judge_max_tokens: 256
  temperature: 0
  logprobs: true
  top_logprobs: 5
  strict_logprobs: true
  request_overrides:
    reasoning:
      effort: low
      exclude: true
  provider_routing:
    order:
      - AkashML
    require_parameters: true
    allow_fallbacks: false

reward_prompt_rejudge:
  run_name: gpt_oss_dual_prompt_audit
  workers: 2
  same_provider_pointwise_control: true
  target_model_name: OpenAI GPT-OSS 120B
  source_attribution_run: experiments/mbpp_gpt_oss_audit_v1/attribution/v1/gpt_oss_pointwise_self_attr_plain_test100_20260825T191005Z
