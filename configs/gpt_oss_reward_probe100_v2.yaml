project:
  name: indistinguishability-as-a-reward
  root: /home/erimoldi/projects/indistinguishability-as-a-reward
  seed: 23

paths:
  data_cache: data/cache
  hf_cache: models/cache/huggingface
  experiments: experiments
  checkpoints: models/checkpoints
  openrouter_env: models/openrouter/.env

dataset:
  phase0_config: configs/phase0.yaml
  name: google-research-datasets/mbpp
  split: test
  selection: all

trial:
  run_name: gpt_oss_reward_probe100_v2
  prompt_count: 100
  expected_reward_calls: 400

actor:
  role: A
  model_id: Qwen/Qwen2.5-1.5B-Instruct
  local_files_only: true
  lora:
    r: 32
    alpha: 32
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

discriminator:
  role: B
  provider: openrouter
  model_id: openai/gpt-oss-120b
  target_model_name: OpenAI GPT-OSS 120B
  attribution_prompt_version: phase0-pointwise-self-attribution-v2-no-system
  judge_max_tokens: 256
  temperature: 0
  top_logprobs: 5
  strict_logprobs: true
  request_overrides:
    reasoning:
      effort: low
      exclude: true
  provider_routing:
    order:
      - CoreWeave
    require_parameters: true
    allow_fallbacks: false

reward:
  type: pointwise_self_attribution_logprob
  value: log_p_own
  max_reward_calls: 400
  max_http_requests: 4800
  max_attempts_per_call: 12
  max_concurrency: 1
  minimum_request_interval_seconds: 8
  max_retry_wait_seconds: 120
  timeout_seconds: 180

training:
  algorithm: GRPO
  world_size: 1
  num_epochs: 1
  num_generations: 4
  generation_batch_size: 40
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  max_steps: 100
  max_prompt_tokens: 4096
  max_completion_length: 768
  temperature: 0.6
  top_p: 1.0
  learning_rate: 3.0e-5
  warmup_ratio: 0.0
  lr_scheduler_type: constant
  gradient_checkpointing: true
  mask_truncated_completions: true
  beta: 3.0e-3
  loss_type: dr_grpo
  scale_rewards: group
  num_completions_to_print: 0
  save_strategy: steps
  save_steps: 50
  save_total_limit: null

evaluation:
  checkpoints: [0, 50, 100]
  batch_size: 8
  unit_test_timeout_seconds: 5
  validation:
    split: validation
    count: 90
    num_generations: 1
    temperature: 0
    top_p: 1.0
  max_reward_attempts: 3
  max_concurrency: 1
  timeout_seconds: 180
  paired_lcb_z: 1.6448536269514722
  max_pass_at_1_drop: 0.02

reward_probe:
  run_name: gpt_oss_reward_probe100_v2_no_system
  prompt_count: 100
