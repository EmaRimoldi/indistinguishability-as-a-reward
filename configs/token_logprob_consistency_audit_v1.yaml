project:
  root: /home/erimoldi/projects/indistinguishability-as-a-reward
  seed: 23

paths:
  split_dir: data/commonsenseqa/cose_v1_11_seed23
  openrouter_env: models/openrouter/.env
  experiments: experiments/infrastructure/token_logprob_consistency_v1

model_id: deepseek/deepseek-v4-flash
providers:
  - DigitalOcean
  - StreamLake
  - DeepInfra
  - CoreWeave
  - Parasail
  - Mancer 2
  - Cloudflare

sample:
  b_own: 5
  qwen_plain: 5
  repeated_b_own: 1
  repeated_qwen_plain: 1
