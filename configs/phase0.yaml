project:
  name: indistinguishability-as-a-reward
  root: /home/erimoldi/projects/indistinguishability-as-a-reward
  seed: 17

paths:
  data_cache: data/cache
  hf_cache: models/cache/huggingface
  experiments: experiments
  openrouter_env: models/openrouter/.env
  model_manifest: models/manifests/models.yaml

dataset:
  name: google-research-datasets/mbpp
  config_name: null
  prompt_style: mbpp_google_original
  fewshot_split: prompt
  fewshot_count: 10
  smoke_split: validation
  smoke_count: 10
  full_splits:
    - train
    - test

generator:
  role: A0
  model_id: Qwen/Qwen2.5-1.5B-Instruct
  local_files_only: false
  dtype: auto
  device_map: auto
  max_new_tokens: 512
  temperature: 0.2
  top_p: 0.95
  variants:
    - plain
    - fewshot_imitation

discriminator:
  role: B
  provider: openrouter
  model_id: deepseek/deepseek-v4-flash
  collect_own_answer: true
  own_answer_max_tokens: 512
  judge_max_tokens: 1
  temperature: 0
  logprobs: true
  top_logprobs: 5
  strict_logprobs: true
  request_overrides:
    reasoning:
      enabled: false
  provider_routing:
    require_parameters: true
    allow_fallbacks: false

unit_tests:
  enabled: true
  timeout_seconds: 5

run_modes:
  smoke_validation_10:
    splits:
      validation: 10
  full_train_test:
    splits:
      train: null
      test: null
