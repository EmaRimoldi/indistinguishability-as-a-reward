project:
  name: indistinguishability-as-a-reward
  root: /home/erimoldi/projects/indistinguishability-as-a-reward
  seed: 23

paths:
  data_cache: data/cache
  hf_cache: models/cache/huggingface
  experiments: experiments
  openrouter_env: models/openrouter/.env
  model_manifest: models/manifests/models.yaml

dataset:
  name: google-research-datasets/mbpp
  config_name: null
  prompt_style: mbpp_google_original
  fewshot_split: prompt
  fewshot_count: 10

discriminator:
  role: B
  provider: openrouter
  model_id: openai/gpt-oss-120b
  judge_max_tokens: 256
  temperature: 0
  logprobs: true
  top_logprobs: 5
  strict_logprobs: true
  request_overrides:
    reasoning:
      effort: low
      exclude: true
  provider_routing:
    order:
      - CoreWeave
    require_parameters: true
    allow_fallbacks: false

pointwise_self_attribution:
  run_name: gpt_oss_pointwise_self_attr_v2_no_system_test100
  prompt_version: phase0-pointwise-self-attribution-v2-no-system
  target_model_name: OpenAI GPT-OSS 120B
  split: test
  task_count: 100
  workers: 1
  inter_request_delay_seconds: 8
  max_attempts_per_call: 12
  max_retry_wait_seconds: 120
  invalid_response_attempts: 4
  invalid_response_retry_delay_seconds: 8
  sampling_mode: paired_all
  paired_non_own_source: plain
  source_runs:
    b_own_glob: gpt_oss_b_own_test100_20260825T185609Z
    plain_glob: plain_test_20260823T212714Z
    imitation_glob: imitation_test_20260823T214322Z
