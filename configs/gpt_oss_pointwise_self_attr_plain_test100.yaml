project:
  name: indistinguishability-as-a-reward
  root: /home/erimoldi/projects/indistinguishability-as-a-reward
  seed: 23

paths:
  data_cache: data/cache
  hf_cache: models/cache/huggingface
  experiments: experiments
  openrouter_env: models/openrouter/.env
  model_manifest: models/manifests/models.yaml

dataset:
  name: google-research-datasets/mbpp
  config_name: null
  prompt_style: mbpp_google_original
  fewshot_split: prompt
  fewshot_count: 10

discriminator:
  role: B
  provider: openrouter
  model_id: openai/gpt-oss-120b
  judge_max_tokens: 256
  temperature: 0
  logprobs: true
  top_logprobs: 5
  strict_logprobs: true
  request_overrides:
    reasoning:
      effort: low
      exclude: true
  provider_routing:
    order:
      - CoreWeave
    require_parameters: true
    allow_fallbacks: false

pointwise_self_attribution:
  run_name: gpt_oss_pointwise_self_attr_plain_test100
  target_model_name: OpenAI GPT-OSS 120B
  split: test
  task_count: 100
  workers: 4
  own_count: 50
  non_own_mix:
    plain: 50
    imitation: 0
  source_runs:
    b_own_glob: gpt_oss_b_own_test100_*
    plain_glob: plain_test_*
    imitation_glob: imitation_test_*
